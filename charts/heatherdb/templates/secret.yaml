{{/*
Only created when the caller hasn't pointed us at their own Secret AND
gave us a non-empty password. An empty password here would set
HEATHER_ADMIN_PASSWORD="" (present-but-empty) on the container, which
the engine treats as an explicit weak password rather than "unset" —
so with no password given we render no Secret and no env var at all,
letting the engine fall back to its own random-password-on-first-boot
path (see statefulset.yaml).
*/}}
{{- if and (not .Values.auth.existingSecret) .Values.auth.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "heatherdb.authSecretName" . }}
  labels:
    {{- include "heatherdb.labels" . | nindent 4 }}
type: Opaque
stringData:
  HEATHER_ADMIN_USER: {{ .Values.auth.username | quote }}
  HEATHER_ADMIN_PASSWORD: {{ .Values.auth.password | quote }}
{{- end }}
