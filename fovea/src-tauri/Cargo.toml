[package]
name = "fovea"
version = "0.1.0"
description = "Fovea — bring sharp inspection to HeatherDB."
authors = ["Aphorion Labs"]
edition = "2021"

[lib]
name = "fovea_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
