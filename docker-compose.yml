# HeatherDB stack.
#
# Works two ways:
#
#   • Local:   `docker compose up -d` (uses .env at repo root if present).
#   • Coolify: import this compose file as a "Docker Compose" application;
#              set the env vars below in Coolify's UI; assign a domain to
#              port 6380. Coolify's Traefik proxy fronts the engine with
#              auto-managed TLS. See docs/coolify.md.
#
# Auth is on by default. Provide credentials via:
#
#   • Local:   .env at repo root (`cp .env.example .env`)
#   • Coolify: Environment Variables tab on the application page
#
# If unset, the engine mints a random admin password on first boot and
# prints it ONCE in the container log:
#
#   docker compose logs heatherdb 2>&1 | grep -A8 first-boot
#
# Rotate any time:
#
#   docker compose exec heatherdb heather user passwd admin --password '...'

services:
  heatherdb:
    build:
      context: .
      dockerfile: Dockerfile
    # Image tag is overridable so Coolify (or a CI pipeline) can pin
    # to a specific build by setting HEATHERDB_IMAGE_TAG.
    image: heatherdb:${HEATHERDB_IMAGE_TAG:-latest}
    container_name: heatherdb
    restart: unless-stopped

    # Direct host port for local dev. Coolify ignores host port mappings
    # when its proxy is in front — the container's `expose` is what
    # matters for routing. Override HEATHERDB_HOST_PORT to bind to a
    # different host port (or empty string '' to skip publishing
    # entirely on a Coolify deploy if you prefer Coolify-only ingress).
    ports:
      - "${HEATHERDB_HOST_PORT:-6380}:6380"
    expose:
      - "6380"

    volumes:
      # Named volume — Coolify maps this into its persistent storage
      # area automatically; locally docker manages it.
      - heatherdb_data:/var/lib/heatherdb

    environment:
      # Tunables — every value below can be overridden via Coolify's
      # Environment Variables UI (or the local .env file).
      HEATHER_DIMENSION:        "${HEATHER_DIMENSION:-128}"
      HEATHER_MAP_SIZE_MB:      "${HEATHER_MAP_SIZE_MB:-4096}"
      HEATHER_REQUEST_TIMEOUT:  "${HEATHER_REQUEST_TIMEOUT:-600}"
      HEATHER_HOST:             "${HEATHER_HOST:-0.0.0.0}"
      HEATHER_PORT:             "${HEATHER_PORT:-6380}"
      RUST_LOG:                 "${RUST_LOG:-info}"

      # First-boot HTTP Basic Auth admin. After the user store is
      # initialised, both vars are ignored — rotate via:
      #   docker compose exec heatherdb heather user passwd admin --password '...'
      HEATHER_ADMIN_USER:       "${HEATHER_ADMIN_USER:-admin}"
      HEATHER_ADMIN_PASSWORD:   "${HEATHER_ADMIN_PASSWORD:-}"

      # DEV ONLY — set to '1' to skip auth entirely. Engine prints a
      # loud warning at boot in this mode.
      HEATHER_AUTH_DISABLED:    "${HEATHER_AUTH_DISABLED:-}"

    # Optional fallback for local dev. Missing .env is non-fatal — the
    # engine falls back to its random-admin-password-on-first-boot path.
    # Coolify ignores this; it injects vars from its UI directly.
    env_file:
      - path: .env
        required: false

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:6380/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    networks:
      - heather

    # Note on Coolify's resource taxonomy: an "Application" in Coolify
    # is anything deployed from a git repo (this), and a "Database" is
    # a one-click managed service Coolify provisions itself (Postgres,
    # Redis, etc.). HeatherDB is semantically a database but it's
    # operationally an Application — the platform doesn't currently
    # support custom Database providers.

networks:
  heather:
    driver: bridge

volumes:
  heatherdb_data:
