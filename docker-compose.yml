version: "3.9"

# HeatherDB stack.
#
#   docker compose up -d           # build + run
#   docker compose logs -f          # tail logs
#   docker compose down             # stop (data persists in the named volume)
#
# After it's up:
#   Engine HTTP   http://localhost:6380   (auth-required by default)
#
# Auth is on by default. Provide credentials via a `.env` file at the
# repo root (copy `.env.example` to `.env` and fill in the blanks). If
# `.env` is missing or empty, the engine mints a random admin password
# on first boot and prints it ONCE in the container logs:
#
#   docker compose logs heatherdb 2>&1 | grep -A8 first-boot
#
# Once the system/ env is initialised the password is hashed and
# settled — operators rotate via:
#
#   docker compose exec heatherdb heather user passwd admin --password '...'

services:
  heatherdb:
    build:
      context: .
      dockerfile: Dockerfile
    image: heatherdb:latest
    container_name: heatherdb
    restart: unless-stopped
    ports:
      - "6380:6380"
    volumes:
      - heatherdb_data:/var/lib/heatherdb
    environment:
      HEATHER_DIMENSION: "128"
      HEATHER_MAP_SIZE_MB: "4096"
      HEATHER_REQUEST_TIMEOUT: "600"
      RUST_LOG: "info"
    # Optional: HEATHER_ADMIN_USER + HEATHER_ADMIN_PASSWORD live in
    # .env at the repo root. Missing file is non-fatal — the engine
    # falls back to its random-admin-password-on-first-boot path.
    env_file:
      - path: .env
        required: false
    healthcheck:

      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:6380/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - heather

  # fovea:
  #   build:
  #     context: ./fovea
  #     dockerfile: Dockerfile
  #   image: fovea:latest
  #   container_name: fovea
  #   restart: unless-stopped
  #   ports:
  #     - "8080:80"
  #   environment:
  #     # Caddy proxies /api/* to this upstream. Inside the compose network,
  #     # `heatherdb` resolves to the engine container.
  #     HEATHER_HOST: "heatherdb:6380"
  #   # Loads AUTH_USER + AUTH_PASS_HASH from fovea/.env if it exists.
  #   # Missing file is non-fatal — the entrypoint runs in no-auth mode
  #   # and prints a loud warning. Copy fovea/.env.example to start.
  #   env_file:
  #     - path: ./fovea/.env
  #       required: false
  #   depends_on:
  #     heatherdb:
  #       condition: service_started
  #   networks:
  #     - heather

networks:
  heather:
    driver: bridge

volumes:
  heatherdb_data:
