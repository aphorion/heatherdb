name: Docker

# Build and publish multi-arch container images to ghcr.io and, if
# DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets are configured, Docker Hub too
# (docker.io/aphorion/heatherdb) — the postgres-style `docker pull
# aphorion/heatherdb` path, no ghcr.io auth required.
#
# Triggers:
#   - push to main:        <registry>/heather-db:edge      (+ heatherdb on Hub)
#   - push tag v*.*.*:     <registry>/...:vX.Y.Z + :vX.Y + :latest
#   - PR (build only, no push) so we catch Dockerfile breakage early
#
# Architectures: linux/amd64 + linux/arm64 (covers VPS + Pi 5 + most clouds).
#
# GHCR uses the workflow's auto-generated GITHUB_TOKEN — no extra secret
# needed. Docker Hub needs two repo secrets:
#   DOCKERHUB_USERNAME   the pushing account/org
#   DOCKERHUB_TOKEN      an access token (Docker Hub → Account Settings →
#                        Security → New Access Token), NOT the account password
# The Docker Hub repo (aphorion/heatherdb) must exist already — create it
# manually first and set its visibility (private for now), since a
# first-push auto-create defaults to public. Until both secrets are set,
# the Docker Hub steps below no-op — GHCR publishing is unaffected.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write          # for cosign keyless signing

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/heather-db
  DOCKERHUB_IMAGE: aphorion/heatherdb

jobs:
  build:
    name: Build & publish image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Native qemu emulators so buildx can target arm64 from an amd64 runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Skip auth on PR (we're not pushing). Otherwise log in to GHCR with the
      # workflow's auto-generated token.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub push is opt-in: only fires once both secrets exist, so
      # this workflow keeps working (GHCR-only) before they're configured.
      - name: Check for Docker Hub credentials
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Generate the tag set + OCI labels from refs.
      #   - main          → :edge + :sha-<short>
      #   - v1.2.3        → :v1.2.3 + :v1.2 + :latest
      #   - PR            → :pr-<n>  (built but not pushed)
      - name: Compute tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ steps.dockerhub.outputs.enabled == 'true' && env.DOCKERHUB_IMAGE || '' }}
          tags: |
            type=ref,event=pr
            type=ref,event=branch,enable=${{ github.ref == 'refs/heads/main' }},priority=900,prefix=,suffix=,value=edge
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=HeatherDB
            org.opencontainers.image.description=Memory that learns — associative-memory database
            org.opencontainers.image.vendor=Aphorion Labs
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=NOASSERTION (proprietary, all rights reserved)

      - name: Build (and push outside PR)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # Keyless cosign signing for non-PR pushes — proves the image came
      # from this repo at this SHA. Skipped on PR (no push to sign).
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Sign published image
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euxo pipefail
          while IFS= read -r tag; do
            cosign sign --yes "${tag}@${DIGEST}"
          done <<< "$TAGS"
