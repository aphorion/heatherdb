name: CI

# Build, lint, and test on every push to main and every PR. Linux only,
# on stable + beta — the project only ever ships Linux binaries (see
# release.yml's matrix), so macOS/Windows runners bought us CI minutes
# without catching anything we'd act on. FreeBSD is exercised in the
# release workflow only — booting a VM per PR is overkill.

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", ".github/ISSUE_TEMPLATE/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", ".github/ISSUE_TEMPLATE/**"]
  workflow_dispatch:

# Don't pile up CI runs for the same branch — supersede in-flight ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  CARGO_INCREMENTAL: 0          # CI = no incremental, tighter caches
  RUSTFLAGS: "-D warnings"

jobs:
  # ─── fast feedback: format check, runs first, kills bad PRs early ───────────
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ─── lint: clippy with deny-warnings, on stable Linux ──────────────────────
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-linux
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ─── tests: Linux, stable + beta ─────────────────────────────────────────
  test:
    name: test (ubuntu-latest · ${{ matrix.rust }})
    needs: fmt
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@v6

      - name: Install ${{ matrix.rust }} toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-ubuntu-latest-${{ matrix.rust }}

      - name: Build
        run: cargo build --workspace --release --locked

      - name: Run tests
        run: cargo test --workspace --release --locked --no-fail-fast

  # ─── docs: catch broken intra-doc links ─────────────────────────────────────
  doc:
    name: doc
    runs-on: ubuntu-latest
    needs: fmt
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-linux
      - run: cargo doc --workspace --no-deps --document-private-items

  # ─── audit: cargo-audit nightly DB sweep against Cargo.lock ─────────────────
  # Plain CLI rather than rustsec/audit-check — that action posts its
  # findings as a GitHub Check Run, which needs `checks: write`. This repo's
  # default GITHUB_TOKEN permission is read-only, and a job-level
  # `permissions:` block can only narrow that, never widen it, so the
  # action's check-run creation fails outright ("Resource not accessible by
  # integration") no matter what this workflow declares. `cargo audit`
  # itself just exits non-zero on a finding — no Checks API involved.
  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  # ─── msrv: ensure we still build on the documented minimum supported Rust ──
  # Mirrors `rust-version` in every crate's Cargo.toml — keep the two in step.
  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v6
      # 1.88 is the real floor, and each constraint below subsumes the last:
      # resolver = "3" needs 1.84, edition = "2024" needs 1.85, and the
      # let-chains in heather_db::read need 1.88. This job pinned 1.84 until
      # the fmt gate ahead of it started passing, at which point it could
      # never have succeeded — cargo refuses the edition outright.
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-msrv
      - run: cargo build --workspace --locked

  # ─── final gate: every other job must pass for the PR to be mergeable ──────
  ci-success:
    name: CI passed
    if: always()
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test, doc, audit, msrv]
    steps:
      - name: Aggregate results
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' >/dev/null
