name: Release

# Triggered by tags shaped like v*.*.* (e.g. v0.1.0, v1.2.3-rc.1).
#
# Builds the `heather` binary (from the `heather_server` crate) for every
# supported target, packages each as a .tar.gz (.zip on Windows), generates
# SHA-256 checksums, and attaches everything to a GitHub Release. The two
# glibc targets also get a `.deb` (apt-installable, systemd unit included) —
# see packaging/deb/.
#
# The four Linux targets build via `cross` (not bare `cargo build`), including
# x86_64-gnu — cross's docker images pin an old glibc baseline, which is
# the whole point: a bare `ubuntu-latest` runner build would link against
# whatever glibc that runner image ships (often newer than what's on a
# user's box) and silently produce a binary that only runs on equally new
# distros. macOS and Windows build natively on their own runners.
#
# FreeBSD was removed rather than left failing; re-add it to the matrix
# when it is wanted.
#
# Targets:
#   linux-x86_64-gnu      Linux glibc 2.31+                 (+ .deb, amd64)
#   linux-x86_64-musl     Linux static (works on Alpine + everything)
#   linux-aarch64-gnu     Linux glibc 2.31+, arm64           (+ .deb, arm64)
#   linux-aarch64-musl    Linux static, arm64
#   macos-aarch64         macOS 11+, Apple silicon      (unsigned, see below)
#   macos-x86_64          macOS 11+, Intel              (unsigned, see below)
#   windows-x86_64        Windows 10+, x64                          (.zip)
#
# The macOS binaries are neither codesigned nor notarized: a downloaded
# archive trips Gatekeeper until the user clears the quarantine attribute.
#
# Manual trigger: workflow_dispatch with a version input lets you cut a
# release without pushing a tag (useful for hotfix experiments).

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write          # needed to create the GitHub Release

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  CARGO_INCREMENTAL: 0
  # The cargo package to build (-p flag) and the binary file it produces.
  # The crate is named `heather_server` historically; the binary is `heather`.
  CARGO_PACKAGE: heather_server
  BINARY_NAME: heather

jobs:
  # ─── derive a single canonical version string for downstream jobs ───────────
  prep:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.derive.outputs.version }}
    steps:
      - id: derive
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

  # ─── build matrix: linux (cross) + macOS/Windows (native) ──────────────────
  build:
    name: ${{ matrix.label }}
    needs: prep
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64-gnu
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: true                         # old-glibc docker image, see header note
            strip: true
            deb: true
            deb-arch: amd64
          - label: linux-x86_64-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cross: true                         # use cross-rs for static musl
            strip: true
            deb: false
          - label: linux-aarch64-gnu
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
            strip: false
            deb: true
            deb-arch: arm64
          - label: linux-aarch64-musl
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            cross: true
            strip: false
            deb: false
          - label: macos-aarch64
            os: macos-14                        # arm64 runner, builds natively
            target: aarch64-apple-darwin
            cross: false
            strip: false                        # `cargo build` output is fine unstripped
            deb: false
          - label: macos-x86_64
            os: macos-14                        # arm64 host, cross-links to x86_64 via the Apple SDK
            target: x86_64-apple-darwin
            cross: false
            strip: false
            deb: false
          - label: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            cross: false
            strip: false                        # no binutils `strip` on the MSVC runner
            deb: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable, target ${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-rs (for ${{ matrix.target }})
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        shell: bash
        run: |
          set -euxo pipefail
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }} -p ${{ env.CARGO_PACKAGE }}
          else
            cargo build --release --locked --target ${{ matrix.target }} -p ${{ env.CARGO_PACKAGE }}
          fi

      - name: Strip binary (same-arch Linux targets only)
        # The Linux runner is x86_64 — its `strip` can handle both gnu/musl
        # x86_64 binaries, but not aarch64 ones (no cross-binutils here).
        # aarch64 binaries ship unstripped rather than risk a silent no-op
        # or a hard failure depending on the runner's binutils build. The
        # macOS/Windows runners are skipped too (`strip: false`): Windows
        # has no binutils `strip` at all.
        if: matrix.strip
        shell: bash
        run: |
          set -euxo pipefail
          BIN=target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}
          strip "$BIN"

      - name: Package
        id: package
        # One step for all three platforms — the shapes differ only in the
        # binary suffix (.exe), the archive format (.zip on Windows, .tar.gz
        # everywhere else) and the checksum tool (macOS has no `sha256sum`,
        # only `shasum -a 256`). The $GITHUB_OUTPUT contract (asset=,
        # checksum=) is identical on every platform so the upload and
        # manifest jobs stay platform-agnostic.
        shell: bash
        env:
          VERSION: ${{ needs.prep.outputs.version }}
          LABEL:   ${{ matrix.label }}
        run: |
          set -euxo pipefail

          # Portable sha256: coreutils on Linux and Git-Bash, BSD shasum on macOS.
          # Both emit the same "<hash>  <file>" line the manifest job expects.
          sha256_of() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1"
            else
              shasum -a 256 "$1"
            fi
          }

          EXE=""
          if [ "$RUNNER_OS" = "Windows" ]; then EXE=".exe"; fi

          STAGE="${BINARY_NAME}-${VERSION}-${LABEL}"
          mkdir -p "dist/$STAGE"

          BIN="target/${{ matrix.target }}/release/${BINARY_NAME}${EXE}"
          cp "$BIN" "dist/$STAGE/"
          cp README.md     "dist/$STAGE/" 2>/dev/null || true
          cp LICENSE*      "dist/$STAGE/" 2>/dev/null || true
          cp CHANGELOG*    "dist/$STAGE/" 2>/dev/null || true

          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            ASSET="${STAGE}.zip"
            # No `zip` on the Windows runner; PowerShell's Compress-Archive
            # keeps the same one-directory-inside shape as the tarballs.
            powershell -NoProfile -Command \
              "Compress-Archive -Path '${STAGE}' -DestinationPath '${ASSET}' -Force"
          else
            ASSET="${STAGE}.tar.gz"
            tar -czf "$ASSET" "$STAGE"
          fi
          sha256_of "$ASSET" > "${ASSET}.sha256"

          echo "asset=dist/$ASSET"        >> "$GITHUB_OUTPUT"
          echo "checksum=dist/$ASSET.sha256" >> "$GITHUB_OUTPUT"

      - name: Install cargo-deb (glibc targets only)
        if: matrix.deb
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Build .deb (glibc targets only)
        id: deb
        if: matrix.deb
        shell: bash
        env:
          VERSION: ${{ needs.prep.outputs.version }}
        run: |
          set -euxo pipefail
          # Strip the leading 'v' — Debian package versions can't start
          # with a non-digit.
          DEB_VERSION="${VERSION#v}"
          cargo deb --no-build --no-strip \
            --target ${{ matrix.target }} \
            --deb-version "$DEB_VERSION" \
            -p ${{ env.CARGO_PACKAGE }} \
            --output dist/

          DEB="$(ls dist/*_${{ matrix.deb-arch }}.deb)"
          sha256sum "$DEB" > "${DEB}.sha256"
          echo "asset=$DEB"          >> "$GITHUB_OUTPUT"
          echo "checksum=${DEB}.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload .deb (glibc targets only)
        if: matrix.deb
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}-deb
          path: |
            ${{ steps.deb.outputs.asset }}
            ${{ steps.deb.outputs.checksum }}
          if-no-files-found: error
          retention-days: 7

  # ─── publish: collect artifacts, generate one combined SHA file, release ────
  release:
    name: Publish GitHub Release
    needs: [prep, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0           # need history for the changelog

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Combined SHA-256 manifest
        working-directory: dist
        run: |
          set -euxo pipefail
          # nullglob so a missing class of asset (e.g. no .zip) doesn't hand
          # sha256sum a literal glob and fail the release.
          shopt -s nullglob
          sha256sum *.tar.gz *.zip *.deb > SHA256SUMS.txt
          cat SHA256SUMS.txt
          # Drop per-asset .sha256 sidecars now that we have a single manifest.
          rm -f *.sha256

      - name: Generate changelog (commits since last tag)
        id: changelog
        env:
          VERSION: ${{ needs.prep.outputs.version }}
        run: |
          set -e
          PREV="$(git describe --tags --abbrev=0 "${VERSION}^" 2>/dev/null || echo "")"
          {
            echo "## What's in $VERSION"
            echo
            if [ -n "$PREV" ]; then
              echo "Changes since \`$PREV\`:"
              echo
              git log --pretty=format:"- %s (%h)" "$PREV..$VERSION" \
                | grep -v -e '^- Merge ' -e '^- chore: bump' || true
            else
              echo "Initial release."
            fi
            echo
            echo "## Downloads"
            echo
            echo "| Platform | Asset |"
            echo "|----------|-------|"
            for f in dist/*.tar.gz dist/*.zip; do
              [ -f "$f" ] || continue
              name="$(basename "$f")"
              # crude label parse — strip BIN_NAME-VERSION- prefix and suffix
              plat="${name#${BINARY_NAME}-${VERSION}-}"
              plat="${plat%.tar.gz}"
              plat="${plat%.zip}"
              echo "| \`$plat\` | [\`$name\`](https://github.com/${{ github.repository }}/releases/download/${VERSION}/${name}) |"
            done
            for f in dist/*.deb; do
              [ -f "$f" ] || continue
              name="$(basename "$f")"
              arch="${name%.deb}"; arch="${arch##*_}"
              echo "| \`ubuntu/debian ($arch, .deb)\` | [\`$name\`](https://github.com/${{ github.repository }}/releases/download/${VERSION}/${name}) |"
            done
            echo
            echo "Install the \`.deb\` on Ubuntu/Debian:"
            echo
            echo '```sh'
            echo "curl -fsSLO https://github.com/${{ github.repository }}/releases/download/${VERSION}/heatherdb_${VERSION#v}_amd64.deb"
            echo "sudo apt install ./heatherdb_${VERSION#v}_amd64.deb"
            echo '```'
            echo
            echo "This installs a \`heatherdb\` systemd service, a dedicated \`heatherdb\` user, and"
            echo "generates admin credentials in \`/etc/heatherdb/env\` — read that file, then"
            echo "\`sudo systemctl start heatherdb\`."
            echo
            echo "The macOS binaries are unsigned — clear the download quarantine before"
            echo "the first run:"
            echo
            echo '```sh'
            echo "xattr -d com.apple.quarantine ./heather"
            echo '```'
            echo
            echo "Verify with the bundled \`SHA256SUMS.txt\`:"
            echo
            echo '```sh'
            echo "curl -fsSLO https://github.com/${{ github.repository }}/releases/download/${VERSION}/SHA256SUMS.txt"
            echo "sha256sum --check SHA256SUMS.txt --ignore-missing"
            echo '```'
          } > RELEASE_NOTES.md
          echo "notes_path=RELEASE_NOTES.md" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.prep.outputs.version }}
          tag_name: ${{ needs.prep.outputs.version }}
          body_path: ${{ steps.changelog.outputs.notes_path }}
          draft: false
          prerelease: ${{ contains(needs.prep.outputs.version, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/SHA256SUMS.txt
