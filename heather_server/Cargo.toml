[package]
name = "heather_server"
version = "0.1.0"
edition = "2024"

[dependencies]
heather_db = { path = "../heather_db" }
heather_algebra = { path = "../heather_algebra" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["limit", "timeout", "trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# bincode for user-record serialisation in the LMDB-backed user store.
bincode = "1"
clap = { version = "4", features = ["derive", "env"] }
rayon = "1"
# Auth — argon2id for password hashing (modern PHC-format hashes), base64
# for parsing HTTP Basic credentials, rand for password generation.
argon2 = "0.5"
base64 = "0.22"
rand = "0.8"
# Backup / restore / snapshot subcommands.
tar = "0.4"
flate2 = "1"
heed = "0.20"   # for live Env::copy_to_file snapshots
toml = "0.8"    # parsing per-database db.toml during restore + snapshot

[dev-dependencies]
tempfile = "3"
