[package]
name = "heather_server"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "HeatherDB — an associative-memory database with an HTTP API"
license = "LicenseRef-Proprietary"

# The binary is named `heather` (not `heather_server`) — operators get
# a short, memorable command:
#
#     heather user create alice --password '...'
#     heather backup create --output ...
#
# The crate keeps the longer name for cargo / dependency clarity; only
# the artefact differs.
[[bin]]
name = "heather"
path = "src/main.rs"

[dependencies]
heather_db = { path = "../heather_db" }
heather_algebra = { path = "../heather_algebra" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["limit", "timeout", "trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# bincode for user-record serialisation in the LMDB-backed user store.
bincode = "1"
clap = { version = "4", features = ["derive", "env"] }
rayon = "1"
# Auth — argon2id for password hashing (modern PHC-format hashes), base64
# for parsing HTTP Basic credentials, rand for password generation.
argon2 = "0.5"
base64 = "0.22"
rand = "0.8"
# Backup / restore / snapshot subcommands.
tar = "0.4"
flate2 = "1"
heed = "0.20"   # for live Env::copy_to_file snapshots
toml = "0.8"    # parsing per-database db.toml during restore + snapshot

[dev-dependencies]
tempfile = "3"

# `cargo deb` packaging — built in CI (release.yml) via `cargo-deb`, not run
# locally as part of a normal build. Produces an apt-installable package with
# a systemd unit, dedicated service account, and generated admin credentials
# on first install. See packaging/deb/ for the maintainer scripts + unit file.
[package.metadata.deb]
name = "heatherdb"
maintainer = "Aphorion Labs <hello@aphorion.dev>"
copyright = "2026, Aphorion Labs"
extended-description = """\
HeatherDB — memory that learns. An associative-memory database: one write \
rule does inference and learning jointly, one read rule is simultaneously \
an attention head, a Hopfield cleanup, and a posterior under a Gaussian \
mixture. Ships as a single `heather` binary with an HTTP API."""
section = "database"
priority = "optional"
depends = "$auto"
maintainer-scripts = "../packaging/deb"
conf-files = ["/etc/heatherdb/env"]
assets = [
    ["target/release/heather", "usr/bin/heather", "755"],
    ["../packaging/deb/heatherdb.service", "lib/systemd/system/heatherdb.service", "644"],
    ["../deploy/README.md", "usr/share/doc/heatherdb/deploy-README.md", "644"],
]
