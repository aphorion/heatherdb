[package]
name = "heather_db"
version = "0.1.0"
edition = "2024"

[dependencies]
heed = "0.20"
rand = "0.8"
rand_distr = "0.4"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
bincode = "3"
rayon = "1"
# Per-database persisted config (db.toml) — see db_config.rs.
toml = "0.8"
# Used by `Server`'s tests AND by downstream tooling that wants scratch
# dirs for spin-up scripts; cheap, leave in default deps.
tempfile = "3"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "write_throughput"
harness = false

[[bench]]
name = "read_latency"
harness = false

[[bench]]
name = "multi_collection"
harness = false

[[bench]]
name = "persistence"
harness = false

[[bench]]
name = "store_ops"
harness = false

[[bench]]
name = "capacity"
harness = false

[[bench]]
name = "graph_search"
harness = false
