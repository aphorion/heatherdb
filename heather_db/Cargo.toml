[package]
name = "heather_db"
version = "0.4.1"
edition = "2024"
rust-version = "1.88"

[dependencies]
heed = "0.20"
rand = "0.8"
rand_distr = "0.4"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
bincode = "1"
rayon = "1"
# Role-scoped scoring unbinds by circular correlation; doing it in the
# frequency domain is O(d log d) instead of the O(d²) direct form, and this
# runs once per candidate document. Same crate heather_algebra binds with.
realfft = "3"
# Per-database persisted config (db.toml) — see db_config.rs.
toml = "0.8"
# Advisory engine lock file (flock) — see server::try_acquire_engine_lock.
fs4 = { version = "0.13", features = ["sync"] }
# Used by `Server`'s tests AND by downstream tooling that wants scratch
# dirs for spin-up scripts; cheap, leave in default deps.
tempfile = "3"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "write_throughput"
harness = false

[[bench]]
name = "read_latency"
harness = false

[[bench]]
name = "multi_collection"
harness = false

[[bench]]
name = "persistence"
harness = false

[[bench]]
name = "store_ops"
harness = false

[[bench]]
name = "capacity"
harness = false

[[bench]]
name = "graph_search"
harness = false
