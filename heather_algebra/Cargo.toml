[package]
name = "heather_algebra"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
heather_db = { path = "../heather_db" }
thiserror = "2"
rand = "0.8"
rand_distr = "0.4"
realfft = "3"
rayon = "1"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "bind_throughput"
harness = false
